<h1>纸牌音效 A/B 试听</h1><p>A 为 BMacZero 真实纸牌录音；B 为 Kenney Casino Audio。两者均标 CC0。本页仅供候选对照，最终听感需人工确认。请在手机上点击同一动作的两个版本。</p>
<section><h2>洗牌</h2><button data-src="candidate-audio/bmaczero/shuffle.wav">A · BMacZero</button><button data-src="candidate-audio/kenney/card-shuffle.ogg">B · Kenney</button><small>A 0.78 秒；B 3.06 秒。</small></section>
