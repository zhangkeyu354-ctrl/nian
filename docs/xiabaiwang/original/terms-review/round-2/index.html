<script>
'use strict';
const bank=JSON.parse(document.querySelector('#bank-data').textContent), key='xb-terms-review-2026-10-24-round2';
const allowed=['pending','keep','common','replace','revise'], names={pending:'未审核',keep:'保留',common:'太常见',replace:'换掉',revise:'改解释'};
let opinions={},showAll=false;
const el=id=>document.getElementById(id), themeName=t=>t==='冷门汉字或词语'?'有趣的词与名字':t;
function warn(msg){el('storage-warning').textContent=msg;}
try{const loaded=JSON.parse(localStorage.getItem(key)||'{}');if(loaded&&typeof loaded==='object'&&!Array.isArray(loaded))opinions=loaded;}catch{warn('浏览器未允许保存。审核仍可进行，请导出意见，避免关闭后丢失。');}
function choice(id){return allowed.includes(opinions[id]?.decision)?opinions[id].decision:'pending';}

function render(){
 const q=el('search').value.trim().toLowerCase(),t=el('theme').value,d=el('difficulty').value,c=el('decision').value;
 const list=bank.filter(r=>(!q||`${r.id} ${r.question} ${r.answer}`.toLowerCase().includes(q))&&(!t||r.theme===t)&&(!d||String(r.difficulty)===d)&&(!c||choice(r.id)===c));
 el('cards').replaceChildren();updateSummary(list.length);
 for(const r of list){
  const a=node('article');a.dataset.id=r.id;a.dataset.choice=choice(r.id);
  const meta=node('div',undefined,'meta');meta.append(node('span',r.id.replace('xb-r2-','#R2-')),node('span',themeName(r.theme)),node('span','★'.repeat(r.difficulty)+' · 本题 '+r.difficulty+' 分','stars'));a.append(meta,node('h2',r.question));
  const details=node('details');details.open=showAll;details.append(node('summary','查看真实解释'));const answer=node('p',r.answer,'answer');details.append(answer);

  const label=node('label','备注（可写不喜欢的原因、建议词或新难度）','feedback'),text=node('textarea');text.value=typeof opinions[r.id]?.note==='string'?opinions[r.id].note:'';text.placeholder='例如：太常见 / 名字太直白 / 这个解释不够有趣';text.maxLength=1000;text.addEventListener('input',()=>{opinions[r.id]={...opinions[r.id],note:text.value};save();});label.append(text);a.append(label);el('cards').append(a);
 }
 if(!list.length)el('cards').append(node('p','没有匹配的词条，换个筛选条件试试。','empty'));

el('import').addEventListener('click',()=>el('file').click());el('file').addEventListener('change',async()=>{const f=el('file').files[0];if(!f)return;try{if(f.size>2000000)throw Error('文件太大');const data=JSON.parse(await f.text());if(data.schema!=='xb-term-review-v1'||data.bankVersion!=='2026-10-24-round2'||!Array.isArray(data.reviews))throw Error('不是这一版的审核意见');const validIds=new Set(bank.map(r=>r.id));for(const r of data.reviews){if(validIds.has(r.id)&&allowed.includes(r.decision))opinions[r.id]={decision:r.decision,note:typeof r.note==='string'?r.note.slice(0,1000):''};}save();render();warn('已导入审核意见。');}catch(e){warn('导入失败：'+e.message);}el('file').value='';});
