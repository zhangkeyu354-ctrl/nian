": "身体与心理学小现象", "source": "https://en.wikipedia.org/wiki/Cutaneous_rabbit_illusion", "sourceNote": "百科条目：对应名称及定义"}, {"id": "xb-review-147", "question": "旋转蛇", "answer": "一类实际静止却让观察者感觉局部正在转动的视觉错觉图案。", "difficulty": 3, "theme": "身体与心理学小现象", "source": "https://en.wikipedia.org/wiki/Rotating_snakes", "sourceNote": "百科条目：对应名称及定义"}, {"id": "xb-review-148", "question": "野轨", "answer": "影视制作中，在拍摄画面之外另外录制的对白、环境声等独立声音素材。", "difficulty": 1, "theme": "职业黑话", "source": "https://en.wikipedia.org/wiki/Wild_track", "sourceNote": "百科条目：对应名称及定义"}, {"id": "xb-review-149", "question": "拉焦", "answer": "拍摄时按人物位置和叙事需要改变镜头焦点，让不同对象先后变得清晰的操作。", "difficulty": 3, "theme": "职业黑话", "source": "https://en.wikipedia.org/wiki/Focus_puller", "sourceNote": "百科条目：对应名称及定义"}, {"id": "xb-review-150", "question": "飞白", "answer": "书法中笔画中露出丝状白痕的一种效果，印刷或设计语境也可能借用这个词。", "difficulty": 1, "theme": "职业黑话", "source": "https://zdic.net/hans/%E9%A3%9E%E7%99%BD", "sourceNote": "汉典：对应词语义项"}, {"id": "xb-review-151", "question": "出血", "answer": "印刷设计中让图像或底色超出最终裁切线，避免裁切误差露出白边的预留部分。", "difficulty": 1, "theme": "职业黑话", "source": "https://en.wikipedia.org/wiki/Bleed_%28printing%29", "sourceNote": "百科条目：对应名称及定义"}, {"id": "xb-review-152", "question": "反白", "answer": "在深色底上把文字或图形以白色或浅色留出的排版处理。", "difficulty": 3, "theme": "职业黑话", "source": "https://zdic.net/hans/%E5%8F%8D%E7%99%BD", "sourceNote": "汉典：对应词语义项"}, {"id": "xb-review-153", "question": "蝴蝶装", "answer": "一种古籍装帧方式，把书叶有字的一面相对折起，再把中缝背部粘合成册，翻开时像展开的蝶翼。", "difficulty": 2, "theme": "职业黑话", "source": "https://www.dpm.org.cn/lemmas/242385.html", "sourceNote": "故宫博物院：器物或装帧词条"}, {"id": "xb-review-154", "question": "骑缝", "answer": "两张纸接合或装订材料交界的中缝位置，常在这里盖章或题字，以便核对材料是否完整一致。", "difficulty": 3, "theme": "职业黑话", "source": "https://zdic.net/hans/%E9%AA%91%E7%BC%9D", "sourceNote": "汉典：对应词语义项"}, {"id": "xb-review-155", "question": "牛腿", "answer": "建筑结构中从柱或墙侧面伸出的短悬臂支承部分，可用于承托梁等构件。", "difficulty": 2, "theme": "职业黑话", "source": "https://en.wikipedia.org/wiki/Corbel", "sourceNote": "百科条目：对应名称及定义"}, {"id": "xb-review-156", "question": "把子", "answer": "中国传统戏曲中用于表演的刀、枪、剑等道具兵器的统称，也引申用于相关武打表演和训练。", "difficulty": 2, "theme": "职业黑话", "source": "https://bo.nacta.edu.cn/py/yf/dyf/index.htm", "sourceNote": "中国戏曲学院：把子与基本功说明"}, {"id": "xb-review-157", "question": "水旗", "answer": "戏曲中用来象征流水、波浪等水景的旗形道具，演员挥动它来表现水势。", "difficulty": 2, "theme": "职业黑话", "source": "https://zdic.net/hans/%E6%B0%B4%E6%97%97", "sourceNote": "汉典：对应词语义项"}, {"id": "xb-review-158", "question": "书口", "answer": "传统书籍翻阅一侧的切口，与书脊相对，也用于版式与装帧描述。", "difficulty": 2, "theme": "职业黑话", "source": "https://zdic.net/hans/%E4%B9%A6%E5%8F%A3", "sourceNote": "汉典：对应词语义项"}, {"id": "xb-review-159", "question": "天头", "answer": "书页上方留出的空白部分，与下方的地脚相对。", "difficulty": 3, "theme": "职业黑话", "source": "https://zdic.net/hans/%E5%A4%A9%E5%A4%B4", "sourceNote": "汉典：对应词语义项"}, {"id": "xb-review-160", "question": "叼口", "answer": "印刷机送纸时由叼牙夹持的纸边区域，该区域一般不能像普通版面一样印刷。", "difficulty": 3, "theme": "职业黑话", "source": "https://www.deity.org.tw/deity/article/zh-tw/subpage/406", "sourceNote": "印刷企业术语表：叼口定义"}]</script>
<script>
'use strict';
const bank=JSON.parse(document.querySelector('#bank-data').textContent), key='xb-terms-review-2026-10-24-v2';
const allowed=['pending','keep','common','replace','revise'], names={pending:'未审核',keep:'保留',common:'太常见',replace:'换掉',revise:'改解释'};
let opinions={},showAll=false;
const el=id=>document.getElementById(id), themeName=t=>t==='冷门汉字或词语'?'有趣的词与名字':t;
function warn(msg){el('storage-warning').textContent=msg;}
try{const loaded=JSON.parse(localStorage.getItem(key)||'{}');if(loaded&&typeof loaded==='object'&&!Array.isArray(loaded))opinions=loaded;}catch{warn('浏览器未允许保存。审核仍可进行，请导出意见，避免关闭后丢失。');}
function choice(id){return allowed.includes(opinions[id]?.decision)?opinions[id].decision:'pending';}
function save(){try{localStorage.setItem(key,JSON.stringify(opinions));}catch{warn('无法自动保存，请用导出按钮保存当前审核意见。');}}
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
for(const theme of [...new Set(bank.map(r=>r.theme))]){const o=node('option',themeName(theme));o.value=theme;el('theme').append(o);}
function updateSummary(visible){const done=bank.filter(r=>choice(r.id)!=='pending').length,kept=bank.filter(r=>choice(r.id)==='keep').length;el('summary').textContent=`显示 ${visible} / ${bank.length} 条 · 已审核 ${done} · 保留 ${kept} · 未审核 ${bank.length-done}`;}
function render(){
 const q=el('search').value.trim().toLowerCase(),t=el('theme').value,d=el('difficulty').value,c=el('decision').value;
 const list=bank.filter(r=>(!q||`${r.id} ${r.question} ${r.answer}`.toLowerCase().includes(q))&&(!t||r.theme===t)&&(!d||String(r.difficulty)===d)&&(!c||choice(r.id)===c));
 el('cards').replaceChildren();updateSummary(list.length);
 for(const r of list){
  const a=node('article');a.dataset.id=r.id;a.dataset.choice=choice(r.id);
  const meta=node('div',undefined,'meta');meta.append(node('span',r.id.replace('xb-review-','#')),node('span',themeName(r.theme)),node('span','★'.repeat(r.difficulty)+' · 本题 '+r.difficulty+' 分','stars'));a.append(meta,node('h2',r.question));
  const details=node('details');details.open=showAll;details.append(node('summary','查看真实解释'));const answer=node('p',r.answer,'answer');details.append(answer);
  const source=node('a',r.sourceNote+' ↗','source');source.href=r.source;source.target='_blank';source.rel='noopener noreferrer';details.append(source);a.append(details);
  const buttons=node('div',undefined,'choice');buttons.setAttribute('aria-label',r.question+'审核选择');
  for(const value of allowed){const b=node('button',names[value]);b.type='button';b.dataset.value=value;b.setAttribute('aria-pressed',String(choice(r.id)===value));b.addEventListener('click',()=>{opinions[r.id]={...opinions[r.id],decision:value};save();a.dataset.choice=value;for(const x of buttons.children)x.setAttribute('aria-pressed',String(x.dataset.value===value));updateSummary(list.length);if(el('decision').value)render();});buttons.append(b);}a.append(buttons);
  const label=node('label','备注（可写不喜欢的原因、建议词或新难度）','feedback'),text=node('textarea');text.value=typeof opinions[r.id]?.note==='string'?opinions[r.id].note:'';text.placeholder='例如：太常见 / 名字太直白 / 这个解释不够有趣';text.maxLength=1000;text.addEventListener('input',()=>{opinions[r.id]={...opinions[r.id],note:text.value};save();});label.append(text);a.append(label);el('cards').append(a);
 }
 if(!list.length)el('cards').append(node('p','没有匹配的词条，换个筛选条件试试。','empty'));
}
for(const id of ['search','theme','difficulty','decision'])el(id).addEventListener(id==='search'?'input':'change',render);
el('answers').addEventListener('click',()=>{showAll=!showAll;el('answers').textContent=showAll?'隐藏全部答案':'显示全部答案';el('answers').setAttribute('aria-pressed',String(showAll));for(const d of document.querySelectorAll('article details'))d.open=showAll;});
el('export').addEventListener('click',()=>{const content={schema:'xb-term-review-v1',bankVersion:'2026-10-24-v2',exportedAt:new Date().toISOString(),reviews:bank.map(r=>({id:r.id,term:r.question,difficulty:r.difficulty,decision:choice(r.id),note:opinions[r.id]?.note||''}))};const blob=new Blob([JSON.stringify(content,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=node('a');a.href=url;a.download='瞎掰王_题库审核意见_2026-10-24.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
el('import').addEventListener('click',()=>el('file').click());el('file').addEventListener('change',async()=>{const f=el('file').files[0];if(!f)return;try{if(f.size>2000000)throw Error('文件太大');const data=JSON.parse(await f.text());if(data.schema!=='xb-term-review-v1'||data.bankVersion!=='2026-10-24-v2'||!Array.isArray(data.reviews))throw Error('不是这一版的审核意见');const validIds=new Set(bank.map(r=>r.id));for(const r of data.reviews){if(validIds.has(r.id)&&allowed.includes(r.decision))opinions[r.id]={decision:r.decision,note:typeof r.note==='string'?r.note.slice(0,1000):''};}save();render();warn('已导入审核意见。');}catch(e){warn('导入失败：'+e.message);}el('file').value='';});
render();
</script></body></html>
