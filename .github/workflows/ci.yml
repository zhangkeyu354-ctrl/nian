# 每次推到 main：把合在一起之后的完整代码跑一遍全部测试并构建一次网站。
# 自动部署（deploy-when-idle.yml）只会上线通过这里的最新版本。
name: ci
on:
  push:
    branches: [main]
  workflow_dispatch: {}
concurrency:
  group: ci-${{ github.sha }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: 单元测试
        run: npm test
      - name: 构建网站
        run: npm run build
