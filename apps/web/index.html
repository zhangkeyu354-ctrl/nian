<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/><meta name="theme-color" content="#111c1e"/><meta name="robots" content="noindex, nofollow"/><link rel="manifest" href="/manifest.webmanifest"/><link rel="icon" type="image/png" href="/assets/pwa-lantern-192.png"/><link rel="apple-touch-icon" href="/assets/pwa-lantern-192.png"/><title>桌游合集</title></head><body><div id="root"></div><script>(function(){var K="boot-reload",n=0;try{n=+sessionStorage.getItem(K)||0}catch(e){}function again(){if(n>=2){show();return}try{sessionStorage.setItem(K,n+1)}catch(e){}var u=new URL(location.href);u.searchParams.set("_v",Date.now());location.replace(u)}function show(){var r=document.getElementById("root");if(r&&!r.firstChild)r.innerHTML='<div style="font:16px sans-serif;color:#eee;background:#111c1e;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center">页面没有加载成功<button style="font-size:16px;padding:12px 24px;border-radius:10px;border:0;background:#efb53c" onclick="location.href=location.pathname+\'?_v=\'+Date.now()+location.search.replace(/^\\?/,\'&\')">重新加载</button></div>'}window.addEventListener("vite:preloadError",function(e){e.preventDefault();again()});window.addEventListener("error",function(e){var t=e.target;if(t&&(t.tagName==="SCRIPT"||t.tagName==="LINK"))again()},true);setTimeout(function(){var r=document.getElementById("root");if(r&&!r.firstChild)show()},12000);window.addEventListener("load",function(){setTimeout(function(){try{sessionStorage.removeItem(K)}catch(e){}},5000)})})()</script><script type="module" src="/src/main.tsx"></script></body></html>
